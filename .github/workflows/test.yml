name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR supersedes the run in progress, so two runs never
# pull the Supabase images at once. Runs on main always finish.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm vitest run tests/unit tests/rrule.test.ts

  rls:
    name: RLS integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` drifted to a CLI whose `supabase start` no longer
          # issues/accepts the static legacy demo JWT keys in
          # .env.test.local.example, so the service-role token downgraded to the
          # anon role and every test failed with "permission denied for table
          # organizations". 2.78.1 is verified to work with those keys.
          version: 2.78.1
      # Only the containers the tests use: the database, auth, the REST API, storage
      # (storage.test.ts, team-deletion.test.ts) and the gateway in front of them.
      # Every other image was downloaded on every run for nothing, and on
      # 2026-09-23 the registry refused those downloads (toomanyrequests) three
      # times in a row before a single test ran.
      #
      # A refused download is usually brief, so retry with a growing wait rather
      # than fail the job.
      - name: Start local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor; then
              exit 0
            fi
            supabase stop --no-backup || true
            if [ "$attempt" -lt 3 ]; then
              echo "supabase start failed (attempt $attempt); retrying in $((attempt * 60))s"
              sleep $((attempt * 60))
            fi
          done
          exit 1
      - name: Copy test env
        run: cp .env.test.local.example .env.test.local
      - run: pnpm install
      - name: Run RLS tests
        run: pnpm test:rls
      # tests/tenant and tests/billing need the same stack but were run by no
      # job at all, which is how three of them stayed broken for eighteen days
      # (BUG-017). They cover subdomain resolution and billing authorization,
      # so silence there is the expensive kind.
      - name: Run tenant and billing integration tests
        run: pnpm vitest run --config vitest.config.rls.mts tests/tenant tests/billing

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm vitest run tests/unit tests/rrule.test.ts

  rls:
    name: RLS integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: `latest` drifted to a CLI whose `supabase start` no longer
          # issues/accepts the static legacy demo JWT keys in
          # .env.test.local.example, so the service-role token downgraded to the
          # anon role and every test failed with "permission denied for table
          # organizations". 2.78.1 is verified to work with those keys.
          version: 2.78.1
      - name: Start local Supabase stack
        run: supabase start
      - name: Copy test env
        run: cp .env.test.local.example .env.test.local
      - run: pnpm install
      - name: Run RLS tests
        run: pnpm test:rls

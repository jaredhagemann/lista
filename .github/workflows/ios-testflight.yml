name: iOS TestFlight

# Trigger manually from the Actions tab, or push a tag like `ios-v1.2.3`.
# Tags should only be pushed after merging to main — the first job enforces
# this by failing the build if the tagged commit is not on main.
on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

jobs:
  check-main:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if tagged commit is not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "❌ This tag does not point to a commit on main. Merge your PR first."
            exit 1
          fi

  build-and-submit:
    name: Build & submit to TestFlight
    runs-on: ubuntu-latest
    needs: check-main
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: pnpm add -g eas-cli

      - name: Build iOS and submit to TestFlight
        working-directory: apps/mobile
        # --auto-submit runs `eas submit` immediately after the build finishes,
        # using the submit.production.ios config already in eas.json.
        # EAS Build runs on Expo's infrastructure, so no macOS runner is needed.
        run: eas build --platform ios --profile production --non-interactive --auto-submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
